spring.application.name=notificacoes-service
server.port=8091

# ---- RabbitMQ (em Docker: SPRING_RABBITMQ_HOST=rabbitmq) ----
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# um e-mail por vez; erro inesperado nunca devolve a mensagem em loop para a fila
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---- SMTP (Mailpit; em Docker: SPRING_MAIL_HOST=mailpit) ----
spring.mail.host=localhost
spring.mail.port=1025
management.health.mail.enabled=false

# ---- Banco de registro dos resultados (H2 em arquivo; em Docker fica no volume /data) ----
spring.datasource.url=jdbc:h2:file:./data/notificacoes
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---- Regras do serviço ----
notificacoes.fila.principal=reengajamento.solicitacoes
notificacoes.fila.retry=reengajamento.retry
notificacoes.fila.falhas=reengajamento.falhas
# espera antes de uma nova tentativa (ms)
notificacoes.retry.atraso-ms=30000
# tentativas antes de enviar para a fila de falhas
notificacoes.max-tentativas=3
notificacoes.email.remetente=lembretes@moodle.local
notificacoes.timezone=America/Sao_Paulo
